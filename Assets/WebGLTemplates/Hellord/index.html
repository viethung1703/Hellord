<!DOCTYPE html>
<html lang="en-us">
<head>
<meta charset="utf-8">
<title>{{{ PRODUCT_NAME }}}</title>
<!-- Hellord v0.0.9 WebGL template: canvas fills the window (game picks an integer zoom), focus on load/click,
     F1-F10 are swallowed while the game has focus so F5 no longer reloads (Shift+1..0 / M are the portable debug keys). -->
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#181425}
#unity-canvas{display:block;width:100vw;height:100vh;background:#181425;outline:none;image-rendering:pixelated;image-rendering:crisp-edges}
#bar{position:absolute;left:50%;top:50%;width:240px;height:6px;margin:-3px 0 0 -120px;background:#3a2c3f}
#fill{width:0;height:100%;background:#ffdb9e}
#msg{position:absolute;left:0;right:0;bottom:8px;text-align:center;color:#ffdb9e;font:12px monospace}
</style>
</head>
<body>
<canvas id="unity-canvas" tabindex="0"></canvas>
<div id="bar"><div id="fill"></div></div>
<div id="msg"></div>
<script>
var canvas=document.getElementById('unity-canvas');
function focusGame(){canvas.focus();window.focus();}
canvas.addEventListener('pointerdown',focusGame);
window.addEventListener('load',focusGame);
window.addEventListener('keydown',function(e){
  if(/^F([1-9]|10)$/.test(e.key)||e.key==='Tab'||e.key===' '||e.key.indexOf('Arrow')===0) e.preventDefault();
},true);
var config={
  arguments:[],
  dataUrl:"Build/{{{ DATA_FILENAME }}}",
  frameworkUrl:"Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
  workerUrl:"Build/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
  codeUrl:"Build/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
  symbolsUrl:"Build/{{{ SYMBOLS_FILENAME }}}",
#endif
  streamingAssetsUrl:"StreamingAssets",
  companyName:{{{ JSON.stringify(COMPANY_NAME) }}},
  productName:{{{ JSON.stringify(PRODUCT_NAME) }}},
  productVersion:{{{ JSON.stringify(PRODUCT_VERSION) }}},
  devicePixelRatio:1, // 1 CSS px = 1 game px, so the integer zoom stays crisp
  showBanner:function(m,t){document.getElementById('msg').textContent=m;}
};
var s=document.createElement('script');
s.src="Build/{{{ LOADER_FILENAME }}}";
s.onload=function(){
  createUnityInstance(canvas,config,function(p){document.getElementById('fill').style.width=(100*p)+'%';})
  .then(function(){document.getElementById('bar').style.display='none';focusGame();})
  .catch(function(m){alert(m);});
};
document.body.appendChild(s);
</script>
</body>
</html>
